<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arafat Rahman · Digital Card</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F5F6FB;color:#111827;min-height:100vh;display:flex;justify-content:center;padding:24px 16px 48px}
.wrap{width:100%;max-width:440px}
.hero{background:linear-gradient(150deg,#6366F1,#4F46E5 45%,#7C3AED);border-radius:28px 28px 0 0;height:150px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:300px;height:300px;right:-90px;top:-140px;border-radius:50%;background:rgba(255,255,255,.12)}
.card{background:#fff;border-radius:0 0 28px 28px;padding:0 24px 28px;box-shadow:0 20px 50px -20px rgba(79,70,229,.25)}
.head{text-align:center}.avatar{width:128px;height:128px;border-radius:50%;object-fit:cover;border:5px solid #fff;margin-top:-68px;position:relative;box-shadow:0 12px 30px -10px rgba(79,70,229,.55);background:#fff}
h1{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-top:14px}
.role{color:#4F46E5;font-weight:600;font-size:15px;margin-top:4px}
.role span{color:#6B7280;font-weight:500}
.logos{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:18px;padding:12px 14px;border:1px solid #EEF0F6;border-radius:16px}
.logos a{display:flex;align-items:center;padding:4px 6px;border-radius:10px;transition:background .15s,transform .15s}.logos a:hover{background:#F5F6FB}.logos a:active{transform:scale(.96)}.logos img{height:30px;display:block}
.social{margin-top:18px;text-align:center}.social p{font-size:12px;color:#6B7280;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}.social div{display:flex;justify-content:center;gap:12px}.social div{perspective:600px}
.social a{position:relative;display:flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:18px;background:linear-gradient(160deg,#FFFFFF 0%,#F1F3FA 100%);border:1px solid #fff;box-shadow:0 5px 0 #DADDEA,0 11px 18px -7px rgba(49,46,129,.35),inset 0 1px 0 #fff,inset 0 -3px 6px rgba(79,70,229,.06);transform:rotateX(10deg);transform-style:preserve-3d;transition:transform .2s ease,box-shadow .2s ease}
.social a:before{content:"";position:absolute;inset:4px 8px auto;height:40%;border-radius:14px 14px 30px 30px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));pointer-events:none}
.social a:hover{transform:rotateX(0) translateY(-3px);box-shadow:0 7px 0 #DADDEA,0 15px 22px -8px rgba(49,46,129,.4),inset 0 1px 0 #fff}
.social a:active{transform:translateY(5px);box-shadow:0 1px 0 #DADDEA,0 3px 8px -4px rgba(49,46,129,.3),inset 0 1px 0 #fff}
.social img{position:relative;width:32px;height:32px;display:block;border-radius:50%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));transform:translateZ(10px)}
.social div{gap:22px}.logos .sep{width:1px;height:28px;background:#E5E7EB}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.cta{perspective:600px}
.cta a{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:16px;font-weight:700;font-size:15px;text-decoration:none;min-height:52px;overflow:hidden;transform:rotateX(8deg);transition:transform .2s ease,box-shadow .2s ease}
.cta a:before{content:"";position:absolute;inset:3px 8px auto;height:45%;border-radius:13px 13px 30px 30px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none}
.cta a svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.cta a{text-shadow:0 1px 2px rgba(0,0,0,.25)}
.wa{background:linear-gradient(180deg,#3BE07A 0%,#22C35E 100%);color:#fff;box-shadow:0 6px 0 #17994A,0 14px 22px -8px rgba(22,163,74,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.save{background:linear-gradient(180deg,#2B3446 0%,#111827 100%);color:#fff;box-shadow:0 6px 0 #000,0 14px 22px -8px rgba(17,24,39,.55),inset 0 1px 0 rgba(255,255,255,.18)}
.cta a:hover{transform:rotateX(0) translateY(-2px)}
.wa:hover{box-shadow:0 8px 0 #17994A,0 18px 26px -10px rgba(22,163,74,.6),inset 0 1px 0 rgba(255,255,255,.4)}
.save:hover{box-shadow:0 8px 0 #000,0 18px 26px -10px rgba(17,24,39,.6),inset 0 1px 0 rgba(255,255,255,.18)}
.cta a:active{transform:translateY(5px)}
.wa:active{box-shadow:0 1px 0 #17994A,0 4px 8px -4px rgba(22,163,74,.5)}
.save:active{box-shadow:0 1px 0 #000,0 4px 8px -4px rgba(17,24,39,.5)}
.cta{padding-bottom:6px}
.list{margin-top:18px;display:grid;gap:8px}
.item{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:#F8F9FD;text-decoration:none;color:inherit;min-height:56px;transition:background .15s}
.item:hover{background:#EEF2FF}
.item i{width:40px;height:40px;border-radius:12px;background:#EEF2FF;color:#4F46E5;display:grid;place-items:center;flex-shrink:0}
.item.g i{background:#DCFCE7;color:#16A34A}
.item div{flex:1;min-width:0}.item b{display:block;font-size:12px;color:#6B7280;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.item span{font-size:15px;font-weight:600;word-break:break-all}.chev{color:#9CA3AF}
.qr{margin-top:22px;text-align:center;border-top:1px dashed #E5E7EB;padding-top:22px}
.qr img{width:100%;max-width:340px;height:auto;aspect-ratio:1;border-radius:22px;border:1px solid #EEF0F6;padding:14px;background:#fff;box-shadow:0 14px 34px -16px rgba(79,70,229,.35);image-rendering:crisp-edges}
.qr p{font-size:14px;color:#6B7280;margin-top:12px;font-weight:500}
.tabs{display:inline-flex;background:#F1F2F8;border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:none;font:600 13px 'Plus Jakarta Sans',sans-serif;padding:8px 14px;border-radius:9px;color:#6B7280;cursor:pointer}
.tabs button{transition:background .2s,color .2s,box-shadow .2s}
.tabs button.on{background:#fff;color:#111827;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs button.on[data-q=wa]{background:linear-gradient(180deg,#3BE07A,#22C35E);color:#fff;box-shadow:0 3px 0 #17994A,0 6px 12px -4px rgba(22,163,74,.5);text-shadow:0 1px 2px rgba(0,0,0,.2)}
.tabs button.on[data-q=vcf]{background:linear-gradient(180deg,#2B3446,#111827);color:#fff;box-shadow:0 3px 0 #000,0 6px 12px -4px rgba(17,24,39,.5)}
.tabs:has(button.on[data-q=wa]) ~ img{border-color:#BBF7D0}
.foot{text-align:center;font-size:12px;color:#9CA3AF;margin-top:16px}
</style></head><body><div class="wrap">
